<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>B&D Collector</title>

    <!-- Importació de tipografies de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <!-- Nova ruta apuntant a la carpeta CSS -->
    <link rel="stylesheet" href="CSS/styles.css">

    <!-- Nova ruta apuntant a la carpeta JS amb defer -->
    <script src="JS/main.js" defer></script>
</head>
<body>

<!-- Capçalera -->
<header class="top-header">
    <h1 class="logo">B&D Collector</h1>
    <a href="cataleg.html" class="search-btn" aria-label="Cercar" style="text-decoration: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </a>
</header>

<main class="app-content">
    <!-- Filtres ràpids (Chips) -->
    <nav class="quick-filters">
        <button class="chip active">Tots</button>
        <button class="chip">LEGO</button>
        <button class="chip">Hot Wheels</button>
    </nav>

    <!-- Secció Destacats LEGO -->
    <section class="highlight-section">
        <h2 class="section-title">Destacats LEGO</h2>
        <div class="carousel" id="carousel-lego">
            <!-- Es generarà via JS -->
        </div>
    </section>

    <!-- Secció Sèries Hot Wheels -->
    <section class="highlight-section">
        <h2 class="section-title">Sèries Hot Wheels</h2>
        <div class="carousel" id="carousel-hw">
            <!-- Es generarà via JS -->
        </div>
    </section>
</main>

<!-- Barra de Navegació Inferior (Bottom Nav) -->
<nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Inici</span>
    </a>
    <a href="cataleg.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Catàleg</span>
    </a>
    <a href="colleccio.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        <span>Col·lecció</span>
    </a>
    <a href="perfil.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Perfil</span>
    </a>
</nav>

</body>
</html>
