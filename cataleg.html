<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>B&D Collector</title>

    <!-- Importació de tipografies de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <!-- Nova ruta apuntant a la carpeta CSS -->
    <link rel="stylesheet" href="CSS/styles.css">

    <!-- Nova ruta apuntant a la carpeta JS amb defer -->
    <script src="JS/main.js" defer></script>
</head>
<body>

<!-- Capçalera amb Cerca Expandida -->
<header class="top-header search-header">
    <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Cercar model, set o ref..." class="search-input">
    </div>
</header>

<main class="app-content">
    <!-- Botó de Filtres -->
    <div class="filter-container">
        <a href="#filter-modal" class="filter-btn" style="text-decoration: none;">
            Filtres (Any, Sèrie, Marca)
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </a>
    </div>

    <!-- Graella de Productes (Es generarà dinàmicament amb JS) -->
    <section class="catalog-grid" id="catalog-grid">
        <div id="loading-spinner" style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: #666;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 10 10"></path></svg>
            <p style="margin-top: 1rem; font-family: 'Inter', sans-serif;">Carregant catàleg des de l'API...</p>
        </div>
    </section>
</main>

<!-- Barra de Navegació Inferior (Botó Catàleg actiu) -->
<nav class="bottom-nav">
    <a href="index.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        </svg>
        <span>Inici</span>
    </a>
    <a href="cataleg.html" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>Catàleg</span>
    </a>
    <a href="colleccio.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span>Col·lecció</span>
    </a>
    <a href="perfil.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Perfil</span>
    </a>
</nav>
<!-- Panell de Filtres Ocult (Sense JS) -->
<div id="filter-modal" class="modal-overlay">
    <div class="bottom-sheet">
        <div class="sheet-header">
            <h3>Filtres avançats</h3>
            <!-- El botó tancar apunta a # (el principi de la pàgina), desactivant el modal -->
            <a href="#" class="close-btn" aria-label="Tancar">×</a>
        </div>
        <div class="sheet-body">
            <label>Selecciona la marca</label>
            <select class="filter-select">
                <option>Totes les marques</option>
                <option>LEGO</option>
                <option>Hot Wheels</option>
            </select>

            <label style="margin-top: 1.5rem; display: flex; justify-content: space-between;">
                <span>Any de llançament fins a:</span>
                <strong id="year-val">2024</strong>
            </label>
            <input type="range" min="1980" max="2024" value="2024" class="filter-slider" id="filter-year">

            <a href="#" id="apply-filters-btn" class="big-action-btn"
               style="display: block; text-align: center; text-decoration: none; margin-top: 2rem;">
                Aplicar filtres
            </a>
        </div>
    </div>
</div>
</body>
</html>
