<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Perfil - B&D Collector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/main.js" defer></script>
</head>
<body>

<header class="top-header">
    <h1 class="logo">El meu perfil</h1>
</header>

<main class="app-content">
    <!-- Targeta d'usuari -->
    <section class="stats-box" style="flex-direction: column; align-items: center; text-align: center; gap: 0.75rem;">
        <div style="width: 72px; height: 72px; border-radius: 50%; background-color: var(--brand-red); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 700;">
            BD
        </div>
        <div>
            <h2 style="font-size: 1.2rem; margin-bottom: 0.25rem;">Col·leccionista Pro</h2>
            <p style="font-size: 0.85rem; color: #666;">Mallorca • Membre des de 2026</p>
        </div>
        <div style="margin-top: 0.5rem; padding-top: 0.75rem; border-top: 1px solid var(--border-color); width: 100%; display: flex; justify-content: space-around;">
            <div class="stat-item">
                <span class="stat-number" id="profile-total-count">0</span>
                <span class="stat-label">Col·lecció</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="profile-wish-count">0</span>
                <span class="stat-label">Desitjats</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">Nivell 4</span>
                <span class="stat-label">Rang</span>
            </div>
        </div>
    </section>

    <!-- Opcions de configuració -->
    <section style="padding: 0 1rem;">
        <h3 class="section-title" style="padding: 0; margin-bottom: 0.75rem;">Preferències i Dades</h3>
        <ul class="collection-list" style="padding: 0;">
            <li class="list-item" style="justify-content: space-between;">
                <span>Escala preferida Hot Wheels</span>
                <strong style="font-size: 0.9rem;">1:64</strong>
            </li>
            <li class="list-item" style="justify-content: space-between;">
                <span>Línies preferides LEGO</span>
                <strong style="font-size: 0.9rem;">Technic / Icons</strong>
            </li>
            <li class="list-item" style="justify-content: space-between;">
                <span>Tema visual</span>
                <strong style="font-size: 0.9rem;">Automàtic (Sistema)</strong>
            </li>
        </ul>

        <button id="clear-collection-btn" class="big-action-btn" style="margin-top: 1rem; background-color: #333;">
            Buidar tota la col·lecció (Reset)
        </button>
    </section>
</main>
