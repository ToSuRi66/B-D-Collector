<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>B&D Collector</title>

    <!-- Importació de tipografies de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <!-- Nova ruta apuntant a la carpeta CSS -->
    <link rel="stylesheet" href="CSS/styles.css">

    <!-- Nova ruta apuntant a la carpeta JS amb defer -->
    <script src="JS/main.js" defer></script>
</head>
<body>

<header class="top-header">
    <h1 class="logo">La meva col·lecció</h1>
</header>

<main class="app-content collection-content">
    <!-- Caixa de resum d'estadístiques -->
    <div class="stats-box">
        <div class="stat-item">
            <!-- Aquí afegim l'ID perquè el JS actualitzi el número -->
            <span class="stat-number" id="total-count">0</span>
            <span class="stat-label">Total peces</span>
        </div>
        <div class="stat-item">
            <span class="stat-number">-</span>
            <span class="stat-label">LEGO</span>
        </div>
        <div class="stat-item">
            <span class="stat-number">-</span>
            <span class="stat-label">Hot Wheels</span>
        </div>
    </div>

    <!-- Pestanyes (Tabs) -->
    <div class="tabs">
        <button class="tab active">Tinc</button>
        <button class="tab">Desitjats</button>
    </div>

    <!-- Llista vertical de col·lecció -->
    <!-- Hem afegit l'ID i l'hem deixat buida perquè el JS hi posi les dades -->
    <ul class="collection-list" id="collection-list">

    </ul>
</main>
