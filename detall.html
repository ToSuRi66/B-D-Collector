<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>B&D Collector</title>

    <!-- Importació de tipografies de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <!-- Nova ruta apuntant a la carpeta CSS -->
    <link rel="stylesheet" href="CSS/styles.css">

    <!-- Nova ruta apuntant a la carpeta JS amb defer -->
    <script src="JS/main.js" defer></script>
</head>
<body>

<!-- Capçalera de detall amb botó enrere -->
<header class="top-header detail-header">
    <a href="cataleg.html" class="icon-btn" aria-label="Tornar enrere">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <h1 class="logo" style="font-size: 1rem;">Detall del model</h1>
    <div style="width: 24px;"></div> <!-- Espaiador per centrar el títol -->
</header>

<main class="app-content detail-content">
    <!-- Imatge principal (Hero) -->
    <div class="hero-image placeholder"></div>

    <div class="product-info-block">
        <span class="ref-badge">#76911</span>
        <h2 class="product-title">007 Aston Martin DB5</h2>
        <p class="product-meta">Llançament: 2022 • 298 Peces</p>

        <div class="product-description">
            <p>Reprodueix l'elegància i sofisticació de l'icònic esportiu britànic. Aquest model inclou detalls autèntics com les llandes de raigs platejades i 4 matrícules intercanviables.</p>
        </div>

        <!-- Botons d'acció -->
        <button class="big-action-btn" id="collection-add-btn">
            + Afegir a la meva col·lecció
        </button>
        <button class="secondary-action-btn" id="wishlist-add-btn">
            ♡ Afegir a la llista de Desitjats
        </button>
    </div>
</main>

<!-- Barra de Navegació Inferior -->
<nav class="bottom-nav">
    <a href="index.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Inici</span>
    </a>
    <a href="cataleg.html" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Catàleg</span>
    </a>
    <a href="colleccio.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        <span>Col·lecció</span>
    </a>
    <a href="perfil.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Perfil</span>
    </a>
</nav>

</body>
</html>
